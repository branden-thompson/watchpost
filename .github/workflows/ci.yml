# CI: the same gates as a local `make verify`, on every push and pull
# request, on Linux and macOS — a tag must never be the first time they run.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency: # a push to a PR branch and its pull_request event run once, not twice (REVIEW M13)
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false # a red gate on one OS must not hide the other OS's result
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "1.27.0" } # the toolchain the gates are proven on; setup-go pins GOTOOLCHAIN=local, so go.mod's go directive alone would run an older stdlib (quality pass Q1)
      # One step per gate so a red run names its gate from the API (quality pass PH-3).
      - run: make fmt
      - run: make vet
      - run: make tidy
      - run: make vuln
      - run: make race
      - run: make lint-imports
      - run: make lint-watermark
      - run: make gate-controls
      - run: make alloc-budget # malloc pins run outside the race detector (quality pass §0.1)
      - run: make release-matrix
      - run: make install-test
        if: runner.os == 'Linux'
