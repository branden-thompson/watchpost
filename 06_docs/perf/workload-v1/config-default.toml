# W14 standard workload v1 - default (0.18.0 D-154). A new listener's map: the builders' defaults.
# VERSIONED: a result names the workload it ran; change a byte and it is v2,
# never an edit. Launched under a scratch HOME by scripts/quality/workload.sh,
# so the listener's own file and caches are never read or written.
