# W14 standard workload v1 - heavy (0.18.0 D-154). Every overlay on - Air quality the tint, the heaviest at a national view (D-149) - every alert category, fire All, detail All.
# VERSIONED: a result names the workload it ran; change a byte and it is v2,
# never an edit. Launched under a scratch HOME by scripts/quality/workload.sh,
# so the listener's own file and caches are never read or written.
theme = 'Watchpost'
units = 'imperial'
clock = '12h'
maps = 'on'
map_radar_ahead_hours = 3
map_quake_feed = '2.5_week'
map_detail_level = 'full'

